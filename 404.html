<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Arquivo não encontrado | Oratio</title>

  <!-- CSS global -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- CSS específico -->
  <link rel="stylesheet" href="/css/erro-404.css">
</head>
<body>

  <main class="erro-container">

    <!-- TOPO -->
    <div class="erro-topo">
      <img src="/icons/logo/logo-white.png" alt="Oratio" class="erro-logo">
    </div>

    <!-- CONTEÚDO -->
    <section class="erro-conteudo">
      <h1 class="erro-codigo">404</h1>
      <h2 class="erro-titulo">Arquivo não encontrado</h2>

      <p class="erro-texto">
       O arquivo que você tentou acessar não está disponível no momento ou foi removido. 
        Você pode retornar à página inicial do Portal Oratio ou nos informar sobre o erro.
      </p>

      <div class="erro-acoes">
        <a href="https://oratioapp.com.br" class="btn btn-primary">Tela inicial</a>
        <a href="https://oratioapp.com.br/contato/" class="btn btn-outline">Entrar em Contato</a>
      </div>
    </section>

    <!-- RODAPÉ -->
    <footer class="erro-footer">
      <div class="footer-titulo">Oratio</div>
      <div class="footer-lema">"Que Seu Nome não se afaste dos seus lábios"</div>
    </footer>

  </main>

</body>
</html>
